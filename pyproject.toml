[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-x"
version = "0.1.0"
description = "Agentic Geospatial Intelligence Engine for Multimodal Satellite Reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SatQuery-X Team" }]
dependencies = [
    "Django>=5.0.0,<5.2.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.3.1",
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",
    "psycopg2-binary>=2.9.9",
    "rasterio>=1.3.10",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "numpy>=1.26.0,<2.1.0",
    "pillow>=10.3.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.1.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "peft>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-pyyaml",
    "types-redis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
