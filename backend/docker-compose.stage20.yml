services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: satquery
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: change-me-in-secret-manager
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: .
    env_file: .env.stage20
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]

  worker:
    build: .
    env_file: .env.stage20
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=INFO"]

volumes:
  postgres_data:
  redis_data:
