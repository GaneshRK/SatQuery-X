version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Layer (PostgreSQL with PostGIS)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: satquery-db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_dev_password
      POSTGRES_DB: satquery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Broker & Cache (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: satquery-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Object Storage (MinIO S3-Compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: satquery-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # SatQuery AI Django REST Framework Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: satquery-backend
    command: sh -c "python manage.py migrate && python manage.py seed_demo_user && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app/backend
      - backend_media:/app/backend/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-satquery-ai-sih26167
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgresql://satquery:satquery_dev_password@db:5432/satquery
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_KEY=minioadmin
      - MINIO_SECRET=minioadminpassword
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SatQuery AI Celery Worker (Async Ingestion, Inferences, Reports)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: satquery-celery-worker
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - ../backend:/app/backend
      - backend_media:/app/backend/media
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-satquery-ai-sih26167
      - DATABASE_URL=postgresql://satquery:satquery_dev_password@db:5432/satquery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SatQuery AI Frontend (React + TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: satquery-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_media:
