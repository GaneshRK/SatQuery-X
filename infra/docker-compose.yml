version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Layer (PostgreSQL with PostGIS)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: satquery-db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_dev_password
      POSTGRES_DB: satquery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Broker & Cache (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: satquery-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Object Storage (MinIO S3-Compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: satquery-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # SatQuery-X FastAPI Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: satquery-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      SATQUERY_ENV: development
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_dev_password@db:5432/satquery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: satquery
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data

  # ---------------------------------------------------------------------------
  # Asynchronous Specialist Inference Worker (Celery)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: satquery-worker
    command: celery -A backend.jobs.celery_app.celery_app worker --loglevel=info
    environment:
      SATQUERY_ENV: development
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_dev_password@db:5432/satquery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: satquery
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data

  # ---------------------------------------------------------------------------
  # Frontend Application (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: satquery-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
