apiVersion: apps/v1
kind: Deployment
metadata:
  name: satquery-backend
  labels:
    app: satquery-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satquery-backend
  template:
    metadata:
      labels:
        app: satquery-backend
    spec:
      containers:
        - name: backend
          image: satquery-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: satquery-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: satquery-backend-svc
spec:
  selector:
    app: satquery-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: satquery-config
data:
  SATQUERY_ENV: "production"
  DATABASE_URL: "postgresql+asyncpg://satquery:secret@postgres-svc:5432/satquery"
  REDIS_URL: "redis://redis-svc:6379/0"
  S3_BUCKET: "satquery-imagery"
  S3_REGION: "ap-south-1"
